<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexDeck panel preview</title>
<!--
  Renders dist/index.js outside Steam: React from a CDN, minimal stand-ins
  for @decky/ui components, and a mock backend behind @decky/api.
  Run `npm run build`, then `python3 -m http.server 8765` in the plugin
  folder and open http://localhost:8765/dev/preview.html
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0e141b; color: #dcdedf; font: 14px/1.35 "Motiva Sans", Arial, sans-serif; }
  #qam { width: 352px; margin: 16px auto; background: #1a1f27; border-radius: 6px; padding-bottom: 16px; }
  .title { font-weight: 700; font-size: 16px; padding: 14px 16px 6px; }
  .section { padding: 8px 16px 4px; }
  .section-title { text-transform: uppercase; font-size: 11px; letter-spacing: .06em; color: #8b929a; margin: 10px 0 6px; font-weight: 700; }
  .row { padding: 6px 0; border-bottom: 1px solid #23262e; }
  .field { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .label { color: #fff; }
  .focusable { cursor: pointer; }
  .focusable:hover, .focusable:focus { background: #23262e; outline: none; }
  .desc { font-size: 12px; color: #8b929a; margin-top: 2px; }
  button { width: 100%; padding: 8px; background: #3d4450; color: #fff; border: 0; border-radius: 2px; cursor: pointer; font: inherit; }
  button:disabled { opacity: .5; }
  select { background: #3d4450; color: #fff; border: 0; padding: 4px; max-width: 170px; }
  progress { width: 100%; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; width: 300px; }
  .toast { background: #23262e; border-left: 3px solid #1a9fff; padding: 8px 10px; border-radius: 3px; }
  #page { display: none; width: 854px; height: 534px; margin: 16px auto; background: #0e141b; border: 1px solid #23262e; border-radius: 6px; position: relative; overflow: hidden; }
  #page.open { display: block; }
  #page .pagebar { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 16px; color: #8b929a; font-size: 12px; }
  #page .pagebar button { width: auto; padding: 4px 10px; }
  .tabs { display: flex; flex-direction: column; height: 100%; }
  .tabstrip { display: flex; gap: 22px; padding: 6px 2.8vw; border-bottom: 1px solid #23262e; flex: none; }
  .tabstrip span { cursor: pointer; color: #8b929a; padding: 4px 0; text-transform: uppercase; font-size: 12px; letter-spacing: .05em; font-weight: 700; }
  .tabstrip span.active { color: #fff; border-bottom: 2px solid #1a9fff; }
  .tabbody { flex: 1; min-height: 0; }
  #legend { position: absolute; bottom: 0; left: 0; right: 0; height: 28px; background: #171d25; color: #8b929a; font-size: 12px; display: flex; gap: 18px; align-items: center; padding: 0 16px; }
  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); align-items: center; justify-content: center; z-index: 5; }
  #modal.open { display: flex; }
  .modal { background: #23262e; border-radius: 6px; padding: 22px 26px; width: 560px; max-height: 80vh; overflow: auto; }
  .modal .buttons { display: flex; gap: 10px; margin-top: 18px; }
  input[type=text] { width: 100%; box-sizing: border-box; background: #0e141b; color: #fff; border: 1px solid #3d4450; padding: 7px; font: inherit; }
  #controls { width: 352px; margin: 0 auto; font-size: 12px; color: #8b929a; display: flex; gap: 6px; flex-wrap: wrap; }
  #controls button { width: auto; padding: 4px 8px; font-size: 12px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="qam"></div>
<div id="controls">
  Simulate:
  <button id="hold">Hold binding</button>
  <button id="release">Release binding</button>
  <button id="uninstall">Hex not installed</button>
  <button id="external">External Hex</button>
  <button id="nomodel">No model yet</button>
  <button id="broken">Hex keeps exiting</button>
</div>
<div id="page"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
  const h = React.createElement;
  window.SP_REACT = React;
  window.SP_REACTDOM = ReactDOM;

  // --- @decky/ui stand-ins ---------------------------------------------------
  const Row = ({ children }) => h("div", { className: "row" }, children);
  // Gamepad buttons on a focused item: Enter is A, x is X, y is Y; the legend
  // under the page shows what they do, as Steam's footer does.
  const legend = (props) => {
    const node = document.getElementById("legend");
    if (!node) return;
    node.textContent = [["A", props.onOKActionDescription], ["X", props.onSecondaryActionDescription], ["Y", props.onOptionsActionDescription]]
      .filter(([, text]) => text).map(([key, text]) => `(${key}) ${text}`).join("     ");
  };
  const Focusable = ({ children, className, style, onActivate, onClick, onSecondaryButton, onOptionsButton, ...props }) => {
    const item = !!(onActivate || onClick);
    return h("div", {
      className, style, tabIndex: item ? 0 : undefined,
      onClick: onClick || onActivate,
      onMouseEnter: item ? () => legend(props) : undefined, onFocus: item ? () => legend(props) : undefined,
      onKeyDown: item ? (e) => {
        if (e.target !== e.currentTarget) return;
        if (e.key === "Enter" && onActivate) onActivate(e);
        if (e.key === "x" && onSecondaryButton) onSecondaryButton(e);
        if (e.key === "y" && onOptionsButton) onOptionsButton(e);
      } : undefined,
    }, children);
  };
  const Tabs = ({ tabs, activeTab, onShowTab }) => h("div", { className: "tabs" },
    h("div", { className: "tabstrip" }, tabs.map((tab) => h("span", {
      key: tab.id, className: tab.id === activeTab ? "active" : undefined, onClick: () => onShowTab(tab.id) }, tab.title))),
    h("div", { className: "tabbody" }, (tabs.find((tab) => tab.id === activeTab) || tabs[0]).content));
  let modalRoot = null;
  const showModal = (element) => {
    const host = document.getElementById("modal");
    const Close = () => { host.className = ""; if (modalRoot) modalRoot.render(null); };
    modalRoot = modalRoot || ReactDOM.createRoot(host);
    host.className = "open";
    modalRoot.render(React.cloneElement(element, { closeModal: Close }));
    return { Close };
  };
  const ModalRoot = ({ children }) => h("div", { className: "modal" }, children);
  const ConfirmModal = ({ strTitle, strDescription, strOKButtonText, onOK, onCancel, closeModal }) => h("div", { className: "modal" },
    h("div", { style: { fontSize: "18px", fontWeight: 700, marginBottom: "8px" } }, strTitle), h("div", null, strDescription),
    h("div", { className: "buttons" },
      h("button", { onClick: () => { closeModal(); if (onOK) onOK(); } }, strOKButtonText || "Confirm"),
      h("button", { onClick: () => { closeModal(); if (onCancel) onCancel(); } }, "Cancel")));
  const routes = {};
  let pageRoot = null;
  const closePage = () => { document.getElementById("page").className = ""; if (pageRoot) pageRoot.render(null); };
  const Navigation = {
    Navigate: (path) => {
      const host = document.getElementById("page");
      pageRoot = pageRoot || ReactDOM.createRoot(host);
      host.className = "open";
      pageRoot.render(h(React.Fragment, null,
        h("div", { className: "pagebar" }, h("button", { onClick: closePage }, "(B) Back"), `Full-screen page ${path} at the Deck's 854 x 534`),
        h(routes[path]), h("div", { id: "legend" })));
      host.scrollIntoView({ behavior: "smooth" });
    },
    NavigateBack: closePage,
    CloseSideMenus: () => {},
  };
  const Field = ({ label, description, children, childrenLayout, focusable, onActivate, indentLevel }) => h("div", {
      className: focusable ? "focusable" : undefined, tabIndex: focusable ? 0 : undefined,
      style: indentLevel ? { paddingLeft: `${indentLevel * 16}px` } : undefined,
      onClick: onActivate, onKeyDown: (e) => { if (onActivate && e.key === "Enter") onActivate(e); } },
    h("div", { className: "field" }, h("span", { className: "label" }, label),
      children && childrenLayout !== "below" ? h("span", null, children) : null),
    description ? h("div", { className: "desc" }, description) : null,
    children && childrenLayout === "below" ? children : null);
  window.DFL = {
    staticClasses: { Title: "title" },
    PanelSection: ({ title, children }) => h("div", { className: "section" }, title ? h("div", { className: "section-title" }, title) : null, children),
    PanelSectionRow: Row,
    Field, Focusable, Tabs, showModal, ModalRoot, ConfirmModal, Navigation,
    TextField: ({ value, placeholder, onChange }) => h("input", { type: "text", value, placeholder, onChange }),
    ButtonItem: ({ children, onClick, disabled, label, description, layout }) => layout !== "below" && label
      ? h("div", null, h("div", { className: "field" }, h("span", { className: "label" }, label),
          h("button", { onClick, disabled, style: { width: "auto" } }, children)),
        description ? h("div", { className: "desc" }, description) : null)
      : h("button", { onClick, disabled }, children),
    ToggleField: ({ label, description, checked, onChange }) => h("label", null,
      h("div", { className: "field" }, h("span", { className: "label" }, label),
        h("input", { type: "checkbox", checked: !!checked, onChange: (e) => onChange(e.target.checked) })),
      description ? h("div", { className: "desc" }, description) : null),
    DropdownItem: ({ label, description, rgOptions, selectedOption, onChange, strDefaultLabel, disabled }) => h("div", null,
      h("div", { className: "field" }, h("span", { className: "label" }, label),
        h("select", {
          disabled,
          value: selectedOption === undefined ? "" : JSON.stringify(selectedOption),
          onChange: (e) => onChange(rgOptions.find((o) => JSON.stringify(o.data) === e.target.value)),
        }, selectedOption === undefined || !rgOptions.some((o) => o.data === selectedOption) ? h("option", { value: "" }, strDefaultLabel || "") : null,
          rgOptions.map((o) => h("option", { key: JSON.stringify(o.data), value: JSON.stringify(o.data) }, o.label)))),
      description ? h("div", { className: "desc" }, description) : null),
    DialogButton: ({ children, onClick, disabled, style }) => h("button", { onClick, disabled, style: { ...style } }, children),
    ProgressBar: ({ nProgress }) => h("progress", nProgress === undefined ? {} : { max: 100, value: nProgress }),
  };

  // --- Mock backend ----------------------------------------------------------
  const listeners = {};
  const emit = (payload) => (listeners.hexdeck_event || []).forEach((fn) => fn(payload));
  const mock = {
    installed: true, external: false, recording: false, capture: null,
    config: { enabled: true, binding: ["L4", "R4"], trigger_mode: "hold", output: "paste", press_enter: false,
              min_hold_ms: 300, display: "auto", hide_hex_pill: true, notifications: true, hex_path: "", speak_language: "" },
    nomodel: false, broken: false, vocabulary: ["Novigrad"],
    model: { id: "parakeet_v3", language: "en" }, preparing: null, downloaded: 0,
    installed_models: ["parakeet_v3", "whisper_large_v3_turbo"], hex: { dictation_hotkey: "option+space", sound_effects: true, microphone: "system-default",
           avoid_bluetooth_microphone: true, recording_audio_behavior: "nothing" },
    last_text: "", install: { state: "idle", stage: "", error: "", version: "", received: 0, total: 0 },
  };
  // Hex's catalog as HexDeck's backend sends it: generated by
  // dev/preview_models.py from languages.py and catalog.py.
  let MODELS = [];
  const catalog = fetch("preview-models.json").then((r) => r.json()).then((c) => { MODELS = c.models; return c; });
  const sizeBytes = (size) => parseFloat(size) * (size.endsWith("GB") ? 1e9 : 1e6);
  const backend = {
    get_state: () => ({
      version: "0.4.0", config: mock.config,
      session: { kind: "gamescope", display: ":1", reason: "Gamescope's main Xwayland" },
      hex: { installed: mock.installed, path: mock.installed ? "/home/deck/.local/bin/hex" : null, version: mock.installed ? "3.4.0" : null,
             running: mock.installed && mock.config.enabled && !mock.broken, owned: !mock.external, external: mock.external,
             service_error: mock.broken ? "Hex keeps exiting; stopped restarting it. See hex-service.log" : "",
             memory: 412000000, update: "current",
             listener: mock.nomodel ? "Waiting for setup" : "Listening", capture: mock.recording ? "recording" : "idle",
             model: { id: mock.model.id, name: MODELS.find((m) => m.id === mock.model.id)?.name ?? mock.model.id, language: mock.model.language,
                      installed: !mock.nomodel, preparing: mock.preparing, downloaded_bytes: mock.downloaded, error: null },
             log: "/home/deck/homebrew/logs/HexDeck/hex-service.log" },
      controller: { device: "/dev/hidraw2", error: "", held: mock.recording ? mock.config.binding : [] },
      install: mock.install, phase: mock.recording ? "recording" : "idle", last_text: mock.last_text, last_error: "",
      keyboard_shortcuts: [["option+space", "Alt + Space"], ["control+space", "Ctrl + Space"], ["f9", "F9"]].map(([value, label]) => ({ value, label })),
    }),
    set_config: (key, value) => { mock.config[key] = value; return { ok: true, key, value }; },
    list_models: async () => {
      const { models, ...rest } = await catalog;
      return { ok: true, ...rest, disk_free: 21.4e9, models: models.map((m) => ({ ...m,
        installed: !mock.nomodel && mock.installed_models.includes(m.id), selected: !mock.nomodel && m.id === mock.model.id })) };
    },
    select_model: (id, language) => {
      const installed = !mock.nomodel && mock.installed_models.includes(id);
      if (mock.nomodel) { mock.nomodel = false; mock.installed_models = []; }
      const choices = MODELS.find((m) => m.id === id).language_choices;
      mock.model = { id, language: language || (choices.includes(mock.model.language) ? mock.model.language : choices[0]) };
      if (!installed) {
        mock.preparing = id; mock.downloaded = 0;
        const timer = setInterval(() => {
          const total = sizeBytes(MODELS.find((m) => m.id === id).size);
          mock.downloaded = Math.min(total, mock.downloaded + total / 8);
          if (mock.preparing !== id) { clearInterval(timer); return; }
          if (mock.downloaded >= total) {
            clearInterval(timer); mock.preparing = null; mock.installed_models.push(id);
            emit({ kind: "model_ready", name: MODELS.find((m) => m.id === id).name, notify: true });
          }
        }, 500);
      }
      return { ok: true, downloading: !installed };
    },
    cancel_model_download: () => { mock.preparing = null; return { ok: true }; },
    remove_model: (id) => {
      if (id === mock.model.id) return { ok: false, error: "That's the model Hex uses. Choose another one first." };
      mock.installed_models = mock.installed_models.filter((m) => m !== id);
      return { ok: true, message: "Deleted" };
    },
    get_hex_settings: () => ({ ok: true, settings: { ...mock.hex }, choices: {
      microphone: ["system-default", "Steam Deck Microphone", "USB Headset"].map((value) => ({ value, label: value })),
      recording_audio_behavior: ["nothing", "duck", "mute"].map((value) => ({ value, label: value })),
    } }),
    set_hex_setting: (key, value) => { mock.hex[key] = typeof mock.hex[key] === "boolean" ? value === "on" : value; return { ok: true }; },
    paste_last: () => { emit({ kind: "done", text: mock.last_text || "Hello from the preview.", notify: true }); return { ok: true }; },
    get_vocabulary: () => ({ ok: true, terms: [...mock.vocabulary] }),
    add_vocabulary: (term) => { if (!mock.vocabulary.includes(term)) mock.vocabulary.push(term); return { ok: true }; },
    remove_vocabulary: (term) => { mock.vocabulary = mock.vocabulary.filter((t) => t !== term); return { ok: true }; },
    install_hex: () => {
      mock.install = { state: "running", stage: "Downloading Hex 3.4.0", error: "", version: "3.4.0", received: 0, total: 9e7 };
      const timer = setInterval(() => {
        mock.install = { ...mock.install, received: mock.install.received + 2e7 };
        if (mock.install.received >= 9e7) { clearInterval(timer); mock.install = { ...mock.install, state: "done" }; mock.installed = true; emit({ kind: "installed", version: "3.4.0", notify: true }); }
      }, 400);
      return { ok: true };
    },
    take_over_hex: () => { mock.external = false; return { ok: true }; },
    restart_hex: () => { mock.broken = false; return { ok: true }; },
    test_dictation: (seconds) => new Promise((resolve) => setTimeout(() => resolve({ ok: true, text: "Hello from the preview." }), seconds * 250)),
    start_binding_capture: () => {
      const t0 = Date.now();
      mock.capture = () => {
        const dt = Date.now() - t0;
        if (dt < 500) return { phase: "release", buttons: [], error: "" };
        if (dt < 1200) return { phase: "listening", buttons: [], error: "" };
        if (dt < 2200) return { phase: "holding", buttons: ["R5"], error: "" };
        if (mock.config.binding[0] !== "R5") { mock.config.binding = ["R5"]; emit({ kind: "binding", buttons: ["R5"], notify: true }); }
        return { phase: "captured", buttons: ["R5"], error: "" };
      };
      return mock.capture();
    },
    get_binding_capture: () => (mock.capture ? mock.capture() : null),
    cancel_binding_capture: () => { mock.capture = null; },
  };
  window.__DECKY_SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED_deckyLoaderAPIInit = {
    connect: (version) => ({
      _version: version,
      callable: (route) => async (...args) => backend[route](...args),
      routerHook: { addRoute: (path, component) => { routes[path] = component; }, removeRoute: (path) => { delete routes[path]; } },
      addEventListener: (event, fn) => ((listeners[event] = listeners[event] || []).push(fn), fn),
      removeEventListener: (event, fn) => { listeners[event] = (listeners[event] || []).filter((f) => f !== fn); },
      toaster: { toast: ({ title, body }) => {
        const node = document.createElement("div");
        node.className = "toast";
        node.innerHTML = `<b></b><div></div>`;
        node.querySelector("b").textContent = title;
        node.querySelector("div").textContent = body;
        document.getElementById("toasts").append(node);
        setTimeout(() => node.remove(), 3500);
      } },
    }),
  };

  document.getElementById("hold").onclick = () => { mock.recording = true; emit({ kind: "recording", notify: true }); };
  document.getElementById("release").onclick = () => {
    mock.recording = false; mock.last_text = "Anyone up for one more round?";
    emit({ kind: "done", text: mock.last_text, notify: true });
  };
  document.getElementById("uninstall").onclick = () => { mock.installed = false; mock.install = { state: "idle", stage: "", error: "", version: "", received: 0, total: 0 }; };
  document.getElementById("external").onclick = () => { mock.external = true; };
  document.getElementById("nomodel").onclick = () => { mock.nomodel = true; };
  document.getElementById("broken").onclick = () => { mock.broken = true; };
</script>
<script type="module">
  const { default: plugin } = await import("../dist/index.js");
  const instance = plugin();
  ReactDOM.createRoot(document.getElementById("qam")).render(
    React.createElement(React.Fragment, null, instance.titleView, instance.content));
</script>
</body>
</html>
